name: Create GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release (optional for push-tag workflow)"
        type: string
        required: false
      run_release_checks:
        description: "Run full release checks before packaging"
        type: boolean
        default: true
        required: false
      publish_to_crates_io:
        description: "Publish crate to crates.io (manual only, skip by default)"
        type: boolean
        default: false
        required: false

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: bevy-open-siege-release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-meta:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release metadata
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            RELEASE_TAG="${{ github.event.inputs.release_tag }}"
            CHECKOUT_REF="refs/tags/$RELEASE_TAG"
            if ! git rev-parse --verify "$CHECKOUT_REF" >/dev/null 2>&1; then
              echo "::error::tag $RELEASE_TAG not found for manual dispatch"
              exit 1
            fi
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
            CHECKOUT_REF="${GITHUB_REF}"
          fi

          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::release_tag could not be determined"
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag must be semantic, got $RELEASE_TAG"
            exit 1
          fi

          VERSION_FROM_TAG="${RELEASE_TAG#v}"
          CARGO_VERSION="$(git show "${CHECKOUT_REF}:Cargo.toml" | awk -F'"' '/^version = / {print $2; exit}')"
          VERSION_FROM_TAG_BASE="${VERSION_FROM_TAG%%-*}"
          if [ "$VERSION_FROM_TAG_BASE" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version $VERSION_FROM_TAG_BASE does not match Cargo version $CARGO_VERSION"
            exit 1
          fi

          PRERELEASE="false"
          if [[ "$VERSION_FROM_TAG" == *-* ]]; then
            PRERELEASE="true"
          fi

          {
            echo "release_tag=$RELEASE_TAG"
            echo "version=$VERSION_FROM_TAG_BASE"
            echo "prerelease=$PRERELEASE"
            echo "checkout_ref=$CHECKOUT_REF"
            echo "commit_sha=$(git rev-parse "$CHECKOUT_REF^{commit}")"
          } >> "$GITHUB_OUTPUT"

      - name: Run full release checks
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_release_checks != 'false' }}
        run: |
          git fetch --force --tags
          git checkout "${{ steps.resolve.outputs.checkout_ref }}"
          ./scripts/release_check.sh

  release-linux:
    name: Build Linux release artifact
    runs-on: ubuntu-latest
    needs:
      - release-meta
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-meta.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install release tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            imagemagick \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            patchelf \
            pkg-config \
            xvfb

      - name: Build and package Linux release artifact
        run: |
          chmod +x scripts/package_release.sh
          xvfb-run -a scripts/package_release.sh

      - name: Compute release package checksum
        run: |
          PACKAGE="bevy_open_siege-${{ needs.release-meta.outputs.version }}-linux-x86_64"
          (
            cd dist
            sha256sum "${PACKAGE}.tar.gz" > "${PACKAGE}.tar.gz.sha256"
          )

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bevy-open-siege-linux
          path: |
            dist/bevy_open_siege-${{ needs.release-meta.outputs.version }}-linux-x86_64.tar.gz
            dist/bevy_open_siege-${{ needs.release-meta.outputs.version }}-linux-x86_64.tar.gz.sha256

  release-web:
    name: Build Web (WASM) release artifact
    runs-on: ubuntu-latest
    needs:
      - release-meta
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-meta.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install web release tooling
        run: |
          set -euo pipefail
          WASM_BINDGEN_VERSION="$(awk '$0 == "name = \"wasm-bindgen\"" {found = 1; next} found && /^version = / {gsub(/"/, "", $3); print $3; exit}' Cargo.lock)"
          if [ -z "$WASM_BINDGEN_VERSION" ]; then
            echo "Failed to resolve wasm-bindgen version from Cargo.lock" >&2
            exit 1
          fi
          echo "WASM_BINDGEN_VERSION=$WASM_BINDGEN_VERSION" >> "$GITHUB_ENV"
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          echo "${PWD}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz" | tar xz
          echo "${PWD}/binaryen-version_123/bin" >> "$GITHUB_PATH"

      - name: Build, optimize, verify, and package Web release
        env:
          WEB_BUILD_VERSION: ${{ needs.release-meta.outputs.version }}
          WEB_BUILD_COMMIT: ${{ needs.release-meta.outputs.commit_sha }}
          WEB_BUILD_REF: ${{ needs.release-meta.outputs.release_tag }}
          WEB_REQUIRE_WASM_OPT: "1"
        run: |
          set -euo pipefail
          ./scripts/build_web_bundle.sh web-dist
          mkdir -p dist
          PACKAGE="bevy_open_siege-${{ needs.release-meta.outputs.version }}-web.tar.gz"
          tar -C web-dist -czf "dist/$PACKAGE" .
          (
            cd dist
            sha256sum "$PACKAGE" > "$PACKAGE.sha256"
          )

      - name: Upload web artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bevy-open-siege-web
          path: |
            dist/bevy_open_siege-${{ needs.release-meta.outputs.version }}-web.tar.gz
            dist/bevy_open_siege-${{ needs.release-meta.outputs.version }}-web.tar.gz.sha256

  release-windows:
    name: Build Windows release artifact
    runs-on: windows-latest
    needs:
      - release-meta
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-meta.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build and package Windows release artifact
        shell: pwsh
        run: |
          ./scripts/package_windows.ps1

      - name: Compute release package checksum
        shell: pwsh
        run: |
          $version = "${{ needs.release-meta.outputs.version }}"
          $file = "dist/bevy_open_siege-$version-windows-x86_64.zip"
          Get-FileHash -Algorithm SHA256 -Path $file | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $(Split-Path -Leaf $file)" | Set-Content -Encoding Ascii "$file.sha256"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bevy-open-siege-windows
          path: |
            dist/bevy_open_siege-${{ needs.release-meta.outputs.version }}-windows-x86_64.zip
            dist/bevy_open_siege-${{ needs.release-meta.outputs.version }}-windows-x86_64.zip.sha256

  release-macos:
    name: Build macOS release artifact
    runs-on: macos-latest
    needs:
      - release-meta
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-meta.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build and package macOS release artifact
        run: |
          chmod +x scripts/package_macos.sh
          ./scripts/package_macos.sh

      - name: Compute release package checksum
        run: |
          PACKAGE="bevy_open_siege-${{ needs.release-meta.outputs.version }}-macos-universal"
          (
            cd dist
            shasum -a 256 "${PACKAGE}.tar.gz" > "${PACKAGE}.tar.gz.sha256"
          )

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bevy-open-siege-macos
          path: |
            dist/bevy_open_siege-${{ needs.release-meta.outputs.version }}-macos-universal.tar.gz
            dist/bevy_open_siege-${{ needs.release-meta.outputs.version }}-macos-universal.tar.gz.sha256

  publish-release:
    name: Publish assets to GitHub Release
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - release-linux
      - release-web
      - release-windows
      - release-macos
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-meta.outputs.checkout_ref }}

      - uses: actions/download-artifact@v8
        with:
          name: bevy-open-siege-linux
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: bevy-open-siege-web
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: bevy-open-siege-windows
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: bevy-open-siege-macos
          path: artifacts

      - name: Verify all platform artifacts are present
        run: |
          for expected in \
            "bevy_open_siege-${{ needs.release-meta.outputs.version }}-linux-x86_64.tar.gz" \
            "bevy_open_siege-${{ needs.release-meta.outputs.version }}-linux-x86_64.tar.gz.sha256" \
            "bevy_open_siege-${{ needs.release-meta.outputs.version }}-web.tar.gz" \
            "bevy_open_siege-${{ needs.release-meta.outputs.version }}-web.tar.gz.sha256" \
            "bevy_open_siege-${{ needs.release-meta.outputs.version }}-windows-x86_64.zip" \
            "bevy_open_siege-${{ needs.release-meta.outputs.version }}-windows-x86_64.zip.sha256" \
            "bevy_open_siege-${{ needs.release-meta.outputs.version }}-macos-universal.tar.gz" \
            "bevy_open_siege-${{ needs.release-meta.outputs.version }}-macos-universal.tar.gz.sha256"; do
            if ! find artifacts -name "$expected" | grep -q .; then
              echo "missing artifact: $expected"
              exit 1
            fi
          done

      - name: Verify package checksums
        run: |
          set -euo pipefail
          while IFS= read -r -d '' checksum; do
            rel_checksum="${checksum#artifacts/}"
            if ! (cd artifacts && sha256sum -c "$rel_checksum"); then
                echo "checksum verification failed for $checksum"
                exit 1
            fi
          done < <(find artifacts -name '*.sha256' -print0)

      - name: Deep-verify native platform archives
        env:
          RELEASE_VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/verify_platform_archive.sh \
            "$(find artifacts -type f -name "bevy_open_siege-${RELEASE_VERSION}-linux-x86_64.tar.gz" -print -quit)" \
            linux-x86_64
          ./scripts/verify_platform_archive.sh \
            "$(find artifacts -type f -name "bevy_open_siege-${RELEASE_VERSION}-windows-x86_64.zip" -print -quit)" \
            windows-x86_64
          ./scripts/verify_platform_archive.sh \
            "$(find artifacts -type f -name "bevy_open_siege-${RELEASE_VERSION}-macos-universal.tar.gz" -print -quit)" \
            macos-universal

      - name: Verify Web release payload
        env:
          RELEASE_VERSION: ${{ needs.release-meta.outputs.version }}
          RELEASE_TAG: ${{ needs.release-meta.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.release-meta.outputs.commit_sha }}
        run: |
          set -euo pipefail
          WEB_ARCHIVE="$(find artifacts -type f -name "bevy_open_siege-${RELEASE_VERSION}-web.tar.gz" -print -quit)"
          test -n "$WEB_ARCHIVE"
          tar -tzf "$WEB_ARCHIVE" > verified-web-files.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' verified-web-files.txt; then
            echo "Web release archive contains an unsafe path" >&2
            exit 1
          fi
          mkdir -p verified-web
          tar -xzf "$WEB_ARCHIVE" -C verified-web
          ./scripts/verify_web_bundle.sh \
            verified-web \
            --expected-version "$RELEASE_VERSION" \
            --expected-commit "$RELEASE_COMMIT" \
            --expected-ref "$RELEASE_TAG"

      - name: Normalize release asset paths
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' -o -name '*.zip' \) -print0 \
            | while IFS= read -r -d '' file; do
              cp -f "$file" release-assets/
            done

      - name: Generate release metadata summary
        env:
          RELEASE_TAG: ${{ needs.release-meta.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release-meta.outputs.version }}
          COMMIT_SHA: ${{ needs.release-meta.outputs.commit_sha }}
        run: |
          METADATA_FILE="release-assets/bevy_open_siege-${RELEASE_VERSION}-release-metadata.txt"
          {
            echo "tag=${RELEASE_TAG}"
            echo "version=${RELEASE_VERSION}"
            echo "commit=${COMMIT_SHA}"
            echo "repository=${{ github.repository }}"
            echo "ref=${{ github.ref }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "actor=${{ github.actor }}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "artifacts:"
            while IFS= read -r -d '' file; do
              base="$(basename "$file")"
              case "$base" in
                *.sha256)
                  echo "  - ${base}: $(cat "$file")"
                  ;;
                *)
                  if command -v sha256sum >/dev/null 2>&1; then
                    echo "  - ${base}: $(sha256sum "$file" | awk '{print $1}')"
                  else
                    echo "  - ${base}: missing_sha256_utility"
                  fi
                  ;;
              esac
            done < <(find release-assets -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.sha256' -o -name '*.zip' \) -print0)
          } > "$METADATA_FILE"

      - name: List upload files
        run: ls -1 release-assets

      - name: Publish GitHub Release with retry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-meta.outputs.release_tag }}
          RELEASE_NAME: "Bevy Open Siege ${{ needs.release-meta.outputs.release_tag }}"
          RELEASE_PRERELEASE: ${{ needs.release-meta.outputs.prerelease }}
          RELEASE_COMMIT: ${{ needs.release-meta.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
              if gh release edit \
                "$RELEASE_TAG" \
                --repo "$GH_REPO" \
                --title "$RELEASE_NAME" \
                --target "$RELEASE_COMMIT" \
                --verify-tag \
                --prerelease="$RELEASE_PRERELEASE" \
                --notes-file RELEASE_NOTES.md; then
                if gh release upload \
                  "$RELEASE_TAG" \
                  release-assets/* \
                  --repo "$GH_REPO" \
                  --clobber; then
                  echo "release updated on attempt $attempt"
                  exit 0
                fi
              fi
            else
              if gh release create \
                "$RELEASE_TAG" \
                --repo "$GH_REPO" \
                --target "$RELEASE_COMMIT" \
                --title "$RELEASE_NAME" \
                --notes-file RELEASE_NOTES.md \
                --verify-tag \
                --prerelease="$RELEASE_PRERELEASE" \
                release-assets/*; then
                echo "release created on attempt $attempt"
                exit 0
              fi
            fi

            sleep_seconds=$((2 ** attempt))
            if [ "$attempt" -ge 5 ]; then
              echo "release publish failed after 5 attempts"
              exit 1
            fi
            echo "release publish failed, retrying in ${sleep_seconds}s (attempt $attempt/5)"
            sleep "$sleep_seconds"
          done

      - name: Move latest tag to stable release
        if: ${{ needs.release-meta.outputs.prerelease == 'false' }}
        env:
          RELEASE_TAG: ${{ needs.release-meta.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.release-meta.outputs.commit_sha }}
        run: |
          set -euo pipefail
          git config user.name 'GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -fa latest "$RELEASE_COMMIT" -m "Latest release $RELEASE_TAG"
          git push origin refs/tags/latest --force

  deploy-release-pages:
    name: Deploy stable release to GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - publish-release
    if: ${{ needs.release-meta.outputs.prerelease == 'false' }}
    steps:
      - name: Dispatch verified release Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-meta.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.release-meta.outputs.commit_sha }}
        run: |
          set -euo pipefail
          RUN_TITLE="Deploy Pages release ${RELEASE_TAG} (release run ${GITHUB_RUN_ID})"

          gh workflow run deploy-pages.yml \
            --repo "$GH_REPO" \
            --ref main \
            -f "release_tag=$RELEASE_TAG" \
            -f "expected_commit=$RELEASE_COMMIT" \
            -f "release_run_id=$GITHUB_RUN_ID"

          PAGES_RUN_ID=""
          for attempt in $(seq 1 60); do
            PAGES_RUN_ID="$(
              gh run list \
                --repo "$GH_REPO" \
                --workflow deploy-pages.yml \
                --event workflow_dispatch \
                --limit 30 \
                --json databaseId,displayTitle \
                | jq -r --arg title "$RUN_TITLE" \
                    '.[] | select(.displayTitle == $title) | .databaseId' \
                | head -n 1
            )"
            if [ -n "$PAGES_RUN_ID" ]; then
              break
            fi
            echo "Waiting for Pages workflow run ($attempt/60)"
            sleep 5
          done

          if [ -z "$PAGES_RUN_ID" ]; then
            echo "Could not find dispatched Pages workflow: $RUN_TITLE" >&2
            exit 1
          fi

          echo "Watching Pages workflow run $PAGES_RUN_ID"
          if ! gh run watch "$PAGES_RUN_ID" --repo "$GH_REPO" --exit-status --interval 10; then
            gh run view "$PAGES_RUN_ID" --repo "$GH_REPO" --log-failed || true
            exit 1
          fi

  publish-crate:
    name: Publish crate to crates.io
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - publish-release
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_crates_io == 'true' && needs.release-meta.outputs.prerelease == 'false' }}
    steps:
      - name: Require crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is required when publish_to_crates_io=true"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-meta.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ needs.release-meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          if cargo publish --locked --no-verify --token "$CARGO_REGISTRY_TOKEN"; then
            echo "Published bevy_open_siege to crates.io for ${RELEASE_TAG}"
            exit 0
          fi

          echo "cargo publish failed, checking if version already exists on crates.io"
          if cargo search bevy-open-siege --limit 1 | grep -q "^bevy-open-siege = \"${RELEASE_TAG#v}\""; then
            echo "Version ${RELEASE_TAG#v} already exists on crates.io"
            exit 0
          fi
          exit 1
